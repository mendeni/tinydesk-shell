name: host-regression
on: [push, pull_request, workflow_call]
permissions:
  contents: read
jobs:
  asan-ubsan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: >-
          cmake -DTDSH_BUILD_HOST=ON -S . -B build-asan -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_C_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer -g"
          -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"
      - name: Build
        run: cmake --build build-asan --parallel
      - name: Test
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1
        run: ctest --test-dir build-asan --output-on-failure

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build tdsh.exe (MinGW) and run its tests
        shell: bash
        run: |
          choco install ninja -y
          cmake -S . -B build-win -G Ninja -DCMAKE_C_COMPILER=gcc -DTDSH_BUILD_HOST=ON
          cmake --build build-win
          ctest --test-dir build-win --output-on-failure --no-tests=error
